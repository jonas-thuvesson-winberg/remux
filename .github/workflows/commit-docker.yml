name: Commit Docker

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, branch, or tag to build'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      short_sha: ${{ steps.commit.outputs.short_sha }}
    steps:
      # Resolve to a full SHA up front so every job in build.yml checks out the
      # same commit, even if a branch input moves while the build is running.
      - name: Resolve commit SHA
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          sha=$(gh api "repos/${{ github.repository }}/commits/${REF}" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-ref
    uses: ./.github/workflows/build.yml
    with:
      version: sha-${{ needs.resolve-ref.outputs.short_sha }}
      docker_tags: "-t ghcr.io/jonas-thuvesson-winberg/remux:sha-${{ needs.resolve-ref.outputs.short_sha }}"
      desktop: false
      ref: ${{ needs.resolve-ref.outputs.sha }}
    secrets: inherit

  summary:
    needs: [resolve-ref, build]
    runs-on: ubuntu-latest
    steps:
      - name: Write job summary
        env:
          REF: ${{ inputs.ref }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          **Docker image** built for \`${{ needs.resolve-ref.outputs.sha }}\` (from \`${REF}\`).

          \`\`\`sh
          docker pull ghcr.io/jonas-thuvesson-winberg/remux:sha-${{ needs.resolve-ref.outputs.short_sha }}
          \`\`\`
          EOF
